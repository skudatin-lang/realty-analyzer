<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#102a43"><meta name="description" content="Быстрый сравнительный анализ недвижимости по скриншотам"><link rel="manifest" href="./manifest.webmanifest"><link rel="icon" href="./assets/icons/icon.svg"><link rel="stylesheet" href="./assets/css/app.css"><title>Полевой анализ объекта</title></head><body>
<header class="topbar"><div><span class="eyebrow">ПОЛЕВОЙ АНАЛИЗ</span><h1>Объект против рынка</h1></div><button id="resetBtn" class="ghost" type="button">Очистить</button></header>
<main class="workspace"><section class="stage-switch" aria-label="Этап работы"><button id="stage1Btn" class="stage-button active" type="button"><strong>Шаг 1</strong><span>До звонка · одно объявление</span></button><button id="stage2Btn" class="stage-button" type="button"><strong>Шаг 2</strong><span>После согласия на встречу · CMA</span></button></section><section class="intro"><p id="stageIntro">Добавьте скриншоты, текст или оба источника по одному объявлению. Конкуренты на первом этапе не нужны.</p><span class="privacy">⌁ Снимки удаляются из памяти сразу после распознавания</span></section>
<section class="panel target"><div class="section-head"><div><span class="step">01</span><h2>Целевой объект</h2></div><span class="required">обязательно</span></div><div id="targetSlot"></div></section>
<section id="competitorsSection" class="competitors" hidden><div class="section-head"><div><span class="step">02</span><h2>Конкуренты для CMA</h2></div><span id="competitorCount" class="count">0</span></div><div id="competitorList" class="card-list"></div><button id="addCompetitor" class="add-button" type="button"><span>＋</span> Добавить конкурента</button></section>
<section id="progressPanel" class="progress-panel" hidden aria-live="polite"><div class="progress-row"><strong id="progressTitle">Подготавливаю изображения</strong><span id="progressPercent">0%</span></div><div class="progress-track"><i id="progressBar"></i></div><p id="progressDetail"></p><div id="failedList"></div></section>
</main><div class="action-dock"><button id="analyzeBtn" class="primary" type="button"><span>Запустить анализ</span><small>нужен интернет</small></button></div>
<template id="objectTemplate"><article class="object-card"><label class="dropzone"><input class="file-input" type="file" accept="image/png,image/jpeg,image/webp" multiple><span class="upload-icon">↥</span><strong>Добавить 1–2 скриншота</strong><small>PNG, JPG или WebP · до 8 МБ каждый · необязательно</small></label><div class="previews"></div><label class="comment-label">Сведения об объекте <span>одно универсальное поле</span><textarea class="comment" rows="4" placeholder="Вставьте описание объявления и любые известные вам существенные сведения. Можно использовать без скриншотов."></textarea></label><div class="card-actions"><button class="retry ghost" type="button" hidden>Повторить</button><button class="remove danger" type="button" hidden>Удалить конкурента</button></div><p class="object-status" aria-live="polite"></p></article></template>
<script src="./assets/js/config.js?v=7"></script><script type="module" src="./assets/js/app.js?v=7"></script></body></html>
